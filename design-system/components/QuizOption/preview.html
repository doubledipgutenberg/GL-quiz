<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>QuizOption — preview</title><style>body{padding:20px} .cols{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start} .cols>*{flex:1 1 300px;max-width:420px}</style></head>
<body>
<div class="cols">
<div class="vx-stack" data-course="fr">
  <p class="vx-question">Tu ___ de Strasbourg ?</p>
  <button class="vx-option"><span class="vx-option__key">A</span><span class="vx-option__text">suis</span></button>
  <button class="vx-option"><span class="vx-option__key">B</span><span class="vx-option__text">es</span></button>
  <button class="vx-option"><span class="vx-option__key">C</span><span class="vx-option__text">est</span></button>
  <div class="vx-tf" style="margin-top:8px"><button class="vx-option">Vrai</button><button class="vx-option">Faux</button></div>
</div>
<div class="vx-stack" data-course="en">
  <p class="vx-question">After checking</p>
  <button class="vx-option is-correct"><span class="vx-option__key"><i class="vx-ico vx-ico--sm vx-ico--check"></i></span><span class="vx-option__text">grew up</span><span class="vx-option__state">Richtig</span></button>
  <button class="vx-option is-wrong"><span class="vx-option__key"><i class="vx-ico vx-ico--sm vx-ico--cross"></i></span><span class="vx-option__text">growed up</span><span class="vx-option__state">Deine Wahl</span></button>
  <button class="vx-option is-dimmed"><span class="vx-option__key">C</span><span class="vx-option__text">has grown up</span></button>
</div></div>
</body>
</html>
