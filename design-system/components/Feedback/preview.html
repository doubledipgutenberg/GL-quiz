<!-- @dsCard group="Quiz" height=600 subtitle="Richtig! · Nicht ganz… · mit Sticker" -->
<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Feedback — preview</title><style>body{padding:20px} .cols{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start} .cols>*{flex:1 1 300px;max-width:420px}</style></head>
<body>
<div class="cols">
<section class="vx-feedback vx-feedback--correct" data-course="fr">
  <div class="vx-feedback__head"><img class="vx-sticker vx-sticker--pop" style="--tilt:-6deg" src="../../assets/Stickers/richtig-fr-croissant-cheer.svg" alt="">
    <div><span class="vx-feedback__exclaim">Super !</span><p class="vx-feedback__title"><i class="vx-ico vx-ico--check"></i>Richtig!<span class="vx-pill">+2 Punkte</span></p></div></div>
  <p class="vx-feedback__body"><b>Tu es</b> — bei <i>tu</i> heißt es immer <i>es</i>.</p>
  <button class="vx-btn vx-btn--sm"><i class="vx-ico vx-ico--sm vx-ico--speaker"></i>Aussprache anhören</button>
  <p class="vx-feedback__quote">„Jawohl, das hast du dir verdient.“</p>
  <button class="vx-btn vx-btn--primary vx-btn--block">Weiter</button></section>
<section class="vx-feedback vx-feedback--wrong" data-course="en">
  <div class="vx-feedback__head"><img class="vx-sticker vx-sticker--pop" style="--tilt:5deg" src="../../assets/Stickers/nicht-ganz-en-thinking.svg" alt="">
    <div><span class="vx-feedback__exclaim">Hmm…</span><p class="vx-feedback__title"><i class="vx-ico vx-ico--cross"></i>Nicht ganz…</p></div></div>
  <dl class="vx-feedback__answers"><dt>Deine Antwort</dt><dd><s>growed up</s></dd><dt>Richtig ist</dt><dd class="is-right">grew up</dd></dl>
  <p class="vx-feedback__body"><i>grow</i> ist unregelmäßig: grow – grew – grown.</p>
  <p class="vx-feedback__quote">„Denk nochmal nach, du bist nah dran.“</p>
  <button class="vx-btn vx-btn--primary vx-btn--block">Weiter</button></section>
</div>
</body>
</html>
