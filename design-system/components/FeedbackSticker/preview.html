var bags = {}, last = {};
function next(course, verdict) {
  var k = course + '|' + verdict;
  if (!bags[k] || !bags[k].length) {
    var pool = S.filter(function (s) { return s.course === course && s.verdict === verdict; });
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }

    bags[k] = pool;
  }
  return (last[k] = bags[k].pop());
}
